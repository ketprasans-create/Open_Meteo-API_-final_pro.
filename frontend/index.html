<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ลมฟ้า — แผนเที่ยวไทยตามอากาศ</title>
    <script>
      // อ่านโหมดที่เลือกไว้จาก localStorage (key เดียวกับ useSettingsStore) ก่อนที่ React จะเริ่มทำงาน
      try {
        var saved = JSON.parse(localStorage.getItem("lomfa-settings"));
        if (saved && saved.state && saved.state.theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
